<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<!-- アプリを入れている人には Safari 上部に「開く」バナーを出す -->
<meta name="apple-itunes-app" content="app-id=6762002751">
<title>Coffee Palette</title>
<link rel="icon" href="/images/icon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fafaf8; --ink: #141210; --ink-soft: #3a3631; --ink-mute: #8a837a;
    --rule: rgba(20,18,15,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141210; --ink: #fafaf8; --ink-soft: #d8d3cc; --ink-mute: #a39b90; --rule: rgba(250,250,248,0.12); }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 16px; text-align: center; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 360px; }
  img { width: 96px; height: 96px; border-radius: 22px; border: 1px solid var(--rule); }
  h1 { font-size: 22px; font-weight: 600; margin: 20px 0 8px; }
  p { font-size: 15px; color: var(--ink-soft); }
  .btn {
    display: inline-block; margin-top: 28px; padding: 14px 28px; min-height: 44px;
    border-radius: 999px; background: var(--ink); color: var(--bg);
    font-size: 15px; font-weight: 600; text-decoration: none;
  }
  .note { margin-top: 20px; font-size: 13px; color: var(--ink-mute); }
</style>
</head>
<body>
<main>
  <img src="/images/icon.png" alt="">
  <h1>Coffee Palette</h1>
  <p id="lead">このQRコードは Coffee Palette アプリで読み取ると、コーヒーの情報をそのまま記録できます。</p>
  <a class="btn" id="dl" href="https://apps.apple.com/app/id6762002751">App Store で入手</a>
  <p class="note" id="note">iPhone 用アプリです。インストール後、もう一度このQRコードを読み取ってください。</p>
</main>
<script>
  // コーヒーの情報は URL の # 以降に入っており、サーバーには送られない。
  // このページはそれを読まず、App Store へ案内するだけ
  var en = !/^ja\b/i.test(navigator.language || '');
  if (en) {
    document.documentElement.lang = 'en';
    document.getElementById('lead').textContent = 'Scan this QR code with the Coffee Palette app to log this coffee in one tap.';
    document.getElementById('dl').textContent = 'Download on the App Store';
    document.getElementById('note').textContent = 'Coffee Palette is an iPhone app. After installing, scan this QR code again.';
  }
  // アプリが入っていれば iOS がここに来る前にアプリを開く。
  // ここに来たのは未インストールの iPhone なので、App Store へそのまま移る
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) location.replace('https://apps.apple.com/app/id6762002751');
</script>
</body>
</html>
